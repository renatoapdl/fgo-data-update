<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel VLBI</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #333; color: white; }
        .status-free { background: #d4edda; } 
        .status-block { background: #fff3cd; } 
        .status-fail { background: #f8d7da; color: #721c24; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Status de Discos - Monitoramento</h1>
    <table>
        <thead>
            <tr>
                <th>Disco</th>
                <th>Capacidade</th>
                <th>Saúde Física</th>
                <th>Sessões</th>
                <th>Uso Total</th>
                <th>Status NASA</th>
            </tr>
        </thead>
        <tbody id="corpo"></tbody>
    </table>

    <script>
        async function carregar() {
            const res = await fetch('Tabela_Mestra.csv');
            const texto = await res.text();
            const linhas = texto.trim().split('\n').slice(1);
            const corpo = document.getElementById('corpo');
            
            corpo.innerHTML = linhas.map(linha => {
                const col = linha.split(','); // Split simples por vírgula
                if (col.length < 6) return '';

                // Mapeamento exato das colunas da Tabela_Mestra
                const [disco, cap, fisico, sessoes, uso, nasa] = col;

                let cor = 'status-free';
                if (nasa === 'BLOCK') cor = 'status-block';
                if (fisico === 'FALHA') cor = 'status-fail';

                return `
                    <tr class="${cor}">
                        <td><b>${disco}</b></td>
                        <td>${cap} GB</td>
                        <td>${fisico}</td>
                        <td style="font-size:11px">${sessoes.replace(/\|/g, '<br>')}</td>
                        <td>${uso} GB</td>
                        <td>${nasa}</td>
                    </tr>`;
            }).join('');
        }
        window.onload = carregar;
    </script>
</body>
</html>
