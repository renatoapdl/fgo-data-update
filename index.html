<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento VLBI - Status de Discos</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #2c3e50; color: white; padding: 12px; }
        td { padding: 10px; border-bottom: 1px solid #ddd; text-align: center; }
        
        /* Estilos baseados no Status NASA e Físico [1-3] */
        .status-free { background-color: #d4edda; color: #155724; } /* RELEASE */
        .status-block { background-color: #fff3cd; color: #856404; } /* HOLD */
        .status-fail { background-color: #f8d7da; color: #721c24; }  /* FALHA */
    </style>
</head>
<body>
    <h1>Painel de Controle de Transferências</h1>
    <table>
        <thead>
            <tr>
                <th>Disco</th>
                <th>Capacidade</th>
                <th>Sessões</th>
                <th>Uso (GB)</th>
                <th>Status NASA</th>
                <th>Status Físico</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
    </table>

    <script>
        async function carregarDados() {
            try {
                const resDiscos = await fetch('Tabela_Discos.csv');
                const resSessoes = await fetch('Tabela_Sessoes.csv');
                
                const discos = csvParaJSON(await resDiscos.text());
                const sessoes = csvParaJSON(await resSessoes.text());

                const corpo = document.getElementById('tabela-corpo');
                corpo.innerHTML = '';

                discos.forEach(disco => {
                    const sessoesDisco = sessoes.filter(s => s.DISCO === disco.DISCO);
                    const usoTotal = sessoesDisco.reduce((acc, s) => acc + parseFloat(s.TAMANHO_SESSAO_GB || 0), 0);
                    
                    let statusGeral = sessoesDisco.length > 0 ? "FREE" : "VAZIO";
                    if (sessoesDisco.some(s => s.STATUS_NASA === 'HOLD')) statusGeral = "BLOCK";
                    if (disco.STATUS_FISICO === 'FALHA') statusGeral = "FAIL";

                    const cor = statusGeral === 'FREE' ? 'status-free' : 
                                statusGeral === 'BLOCK' ? 'status-block' : 
                                statusGeral === 'FAIL' ? 'status-fail' : '';

                    corpo.innerHTML += `
                        <tr class="${cor}">
                            <td><strong>${disco.DISCO}</strong></td>
                            <td>${disco.CAPACIDADE_TOTAL_GB} GB</td>
                            <td>${sessoesDisco.map(s => s.COD_SESSAO).join(', ') || '-'}</td>
                            <td>${usoTotal} GB</td>
                            <td>${statusGeral}</td>
                            <td>${disco.STATUS_FISICO}</td>
                        </tr>`;
                });
            } catch (e) { console.error("Erro:", e); }
        }

        function csvParaJSON(csv) {
    const linhas = csv.split('\n').filter(row => row.trim() !== '');
    if (linhas.length === 0) return [];

    // IMPORTANTE: Use linhas para pegar a primeira linha (cabeçalho)
    const cabecalho = linhas.split(',').map(h => h.trim()); 
    
    return linhas.slice(1).map(linha => {
        const valores = linha.split(',').map(v => v.trim());
        return cabecalho.reduce((obj, col, i) => {
            obj[col] = valores[i];
            return obj;
        }, {});
    });
}
        window.onload = carregarDados;
    </script>
</body>
</html>
